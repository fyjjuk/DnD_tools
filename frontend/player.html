<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jugador · Combate D&D 5e</title>
<link rel="stylesheet" href="/static/app.css?v=2.4">
</head>
<body>

<div id="join-view" class="card-view">
  <h1>Unirse al combate</h1>
  <p class="hp-text">Pide el código de sesión a tu DM.</p>
  <form id="join-form">
    <input id="j-code" placeholder="Código (ej. K7M2QP)" maxlength="6" required>
    <input id="j-name" placeholder="Tu nombre / nombre del PJ" maxlength="40" required>
    <button type="submit" class="primary">Entrar</button>
  </form>
  <p id="join-error" class="error"></p>
</div>

<div id="combat-view" class="hidden">
  <header class="topbar">
    <div>
      <div class="label">Sesión</div>
      <div id="p-code" class="code">------</div>
    </div>
    <div class="text-right">
      <div class="label">Ronda</div>
      <div id="p-round" class="round">1</div>
    </div>
  </header>

  <nav class="nav-tabs">
    <button id="tab-combat" class="tab-btn active" type="button">⚔️ Combate</button>
    <button id="tab-sheet" class="tab-btn" type="button">📜 Mi Ficha</button>
  </nav>

  <main id="pane-combat">
    <div id="p-turn" class="turn-banner">Esperando inicio del combate…</div>
    <div id="p-me" class="me-panel"></div>

    <section class="panel">
      <h2>Orden de iniciativa</h2>
      <div id="p-list" class="combatants"></div>
    </section>
  </main>

  <main id="pane-sheet" class="hidden">
    <div id="sheet-content"></div>
  </main>
</div>

<div id="initiative-modal" class="hidden" style="position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.75);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px">
  <div style="background:var(--panel);border:2px solid #8b5cf6;border-radius:12px;padding:24px;max-width:360px;width:100%;text-align:center">
    <h2 style="margin:0 0 8px;color:#8b5cf6">🎲 ¡Tira Iniciativa!</h2>
    <p id="init-modal-info" class="hp-text" style="margin-bottom:16px">El DM ha iniciado el combate. Tira tu d20 para determinar el turno.</p>
    <div style="font-size:3rem;margin:16px 0" id="init-dice-display">🎲</div>
    <div class="row-actions" style="justify-content:center;gap:12px">
      <button id="btn-roll-d20" type="button" class="primary" style="background:#8b5cf6;padding:12px 24px;font-size:1.1rem">¡Tirar 1d20!</button>
    </div>
    <p id="init-modal-result" class="hp-text" style="margin-top:12px;font-weight:bold"></p>
  </div>
</div>

<div id="player-redirect" class="hidden">Redirigiendo…</div>

<script src="/static/common.js?v=2.4"></script>
<script src="/static/player.js?v=2.4"></script>
</body>
</html>
